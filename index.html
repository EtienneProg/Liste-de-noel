<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La liste de Noël d'Elyas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>
  /* ⚙️ CONFIG : colle ici l'URL de ton déploiement Apps Script (vide = mode démo local) */
  window.API_URL = 'https://script.google.com/macros/s/AKfycbxKOQWRkLYMT93fe_5gcYd9swnt0vtpY9o3Wx_34S2I2p-gqzd9ovgayYWs0GBf7I51/exec';
  window.REFRESH_MS = 15000;
</script>
<style>
:root{
  --night:#0b1f2e; --night2:#123a33; --red:#c8102e; --red-dark:#8f0b21;
  --green:#1f6f4a; --gold:#f4c35a; --cream:#fff8ec; --ink:#2a1a12; --muted:#7a6656;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1d5a4a 0%, transparent 60%),
    linear-gradient(180deg,var(--night) 0%, var(--night2) 100%);
  background-attachment:fixed; overflow-x:hidden;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 16px 80px}

/* guirlande */
.lights{display:flex;justify-content:space-between;padding:0 6px;height:34px;position:relative;z-index:2}
.lights::before{content:"";position:absolute;left:0;right:0;top:4px;height:14px;border-bottom:2px solid #2d2d2d;border-radius:0 0 50% 50%/0 0 100% 100%}
.lights i{width:12px;height:18px;border-radius:50%;margin-top:14px;position:relative;animation:blink 1.6s infinite}
.lights i::before{content:"";position:absolute;top:-5px;left:3px;width:6px;height:6px;background:#333;border-radius:2px}
.lights i:nth-child(4n+1){background:#ff4d5e;color:#ff4d5e}
.lights i:nth-child(4n+2){background:#ffd54a;color:#ffd54a;animation-delay:.4s}
.lights i:nth-child(4n+3){background:#4fe39a;color:#4fe39a;animation-delay:.8s}
.lights i:nth-child(4n+4){background:#5ab8ff;color:#5ab8ff;animation-delay:1.2s}
@keyframes blink{0%,100%{box-shadow:0 0 14px 3px currentColor;opacity:1}50%{box-shadow:none;opacity:.45}}

header{text-align:center;color:#fff;padding:28px 0 8px}
header .kicker{letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:13px;color:var(--gold)}
h1{font-family:'Mountains of Christmas',cursive;font-size:clamp(44px,9vw,92px);line-height:1;margin:8px 0 6px;
   text-shadow:0 4px 0 var(--red-dark),0 10px 30px rgba(0,0,0,.5)}
header p{margin:6px auto 0;max-width:560px;opacity:.85;font-size:17px}

.progress{max-width:520px;margin:26px auto 0;color:#fff}
.progress .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:8px}
.bar{height:18px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.bar span{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);
  background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#fff 12px 24px);animation:slide 1s linear infinite}
@keyframes slide{to{background-position:34px 0}}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:28px 0 24px}
.chip{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-weight:800;
  padding:9px 16px;border-radius:99px;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.15)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.status{text-align:center;color:rgba(255,255,255,.7);font-size:13px;margin-top:-10px;margin-bottom:18px;min-height:18px}
.demo{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;border-radius:6px;padding:2px 8px;margin-right:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}

/* carte cadeau */
.slot{display:flex;animation:pop .5s both}
.card{position:relative;flex:1;background:var(--cream);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 14px 30px rgba(0,0,0,.35);transition:transform .25s,box-shadow .25s}
.slot:hover .card{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 22px 40px rgba(0,0,0,.45)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}}
/* ruban vertical + horizontal */
.media::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 9px);width:18px;background:var(--red);opacity:0;z-index:3;transition:.4s;pointer-events:none}
.card .ribbon-tag{position:absolute;top:12px;left:-6px;z-index:4;background:var(--gold);color:var(--ink);font-weight:900;font-size:12px;
  padding:5px 12px 5px 14px;border-radius:0 6px 6px 0;box-shadow:0 3px 8px rgba(0,0,0,.25);letter-spacing:.03em}
.card .ribbon-tag::after{content:"";position:absolute;left:0;bottom:-6px;border-top:6px solid #b08626;border-left:6px solid transparent}

.media{position:relative;aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px;transition:opacity .3s,filter .4s,transform .4s}
.slot:hover .media img{transform:scale(1.04)}
.media .placeholder{font-size:90px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots b{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.2)}
.dots b.on{background:var(--red)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;padding:0 0 3px;font:900 26px/1 'Nunito',sans-serif;color:#fff;background:rgba(200,16,46,.85);
  box-shadow:0 3px 8px rgba(0,0,0,.3);opacity:.85;transition:opacity .2s,transform .2s,background .2s}
.nav.prev{left:8px}.nav.next{right:8px}
.nav:hover{opacity:1;background:var(--red);transform:translateY(-50%) scale(1.1)}
@media (hover:hover){.nav{opacity:0}.slot:hover .nav{opacity:.85}.slot:hover .nav:hover{opacity:1}}

.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;border-top:3px dashed #ead9bd}
.name{font-weight:900;font-size:19px;line-height:1.2;margin:0}
.name::first-letter{text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#e9f5ee;color:var(--green)}
.comment{font-size:14px;color:var(--muted);margin:0;line-height:1.4}
.comment::before{content:"✏️ "}
.links{display:flex;flex-direction:column;gap:8px}
.shop{display:block;text-align:center;font-weight:900;font-size:15px;text-decoration:none;color:var(--green);
  border:2px solid var(--green);border-radius:12px;padding:9px 14px;background:#fff;transition:background .15s,color .15s}
.shop:hover{background:var(--green);color:#fff}
.shop small{font-weight:700;opacity:.75;text-transform:capitalize}
.spacer{flex:1}
.btn{border:0;font:inherit;font-weight:900;font-size:16px;cursor:pointer;border-radius:12px;padding:12px 16px;width:100%;
  background:linear-gradient(180deg,#e2223f,var(--red));color:#fff;box-shadow:0 4px 0 var(--red-dark);transition:transform .1s,box-shadow .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.green{background:linear-gradient(180deg,#2b8a5d,var(--green));box-shadow:0 4px 0 #134430}

/* état réservé */
.card.reserved .media::before{opacity:.92}
.card.reserved .media img{filter:grayscale(.85) brightness(.95);opacity:.55}
.card.reserved .media::after{content:"🎀";position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:56px;z-index:4;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.stamp{position:absolute;z-index:5;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);
  background:rgba(255,248,236,.96);border:3px solid var(--green);color:var(--green);border-radius:10px;
  padding:8px 14px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25);max-width:85%}
.stamp small{display:block;font-weight:800;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.stamp strong{display:block;font-family:'Mountains of Christmas',cursive;font-size:28px;line-height:1.1;word-break:break-word}
.reserved-note{font-weight:800;color:var(--green);text-align:center;padding:10px;border-radius:12px;background:#e9f5ee}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(5,15,20,.65);backdrop-filter:blur(4px);padding:16px}
.modal.open{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{background:var(--cream);border-radius:22px;max-width:420px;width:100%;padding:26px 24px 22px;position:relative;
  box-shadow:0 30px 60px rgba(0,0,0,.5);border:4px solid var(--gold);animation:pop .3s}
.dialog .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.dialog h2{font-family:'Mountains of Christmas',cursive;font-size:36px;margin:0 0 4px;color:var(--red)}
.dialog .what{display:flex;gap:12px;align-items:center;margin:12px 0 18px;padding:10px;background:#fff;border-radius:12px}
.dialog .what img{width:58px;height:58px;object-fit:contain}
.dialog .what span{font-weight:900}
.dialog label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
.dialog input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid #e2cfae;background:#fff;outline:none}
.dialog input:focus{border-color:var(--red)}
.dialog .hint{font-size:12px;color:var(--muted);margin:8px 0 16px}
.dialog .err{color:var(--red);font-weight:800;font-size:14px;min-height:20px;margin-bottom:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:60;background:#fff;color:var(--ink);
  padding:14px 20px;border-radius:14px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}

.empty{color:#fff;text-align:center;opacity:.8;padding:40px;grid-column:1/-1}
footer{text-align:center;color:rgba(255,255,255,.55);font-size:13px;margin-top:50px}
.confetti{position:fixed;top:-20px;z-index:70;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div class="lights" id="lights"></div>
<div class="wrap">
  <header>
    <div class="kicker">✨ Noël 2026 ✨</div>
    <h1>La liste d'Elyas</h1>
    <p>Choisis un cadeau, réserve-le avec ton prénom… et le Père Noël s'occupe du reste 🎅</p>
    <div class="progress">
      <div class="lbl"><span id="countLbl">…</span><span id="pctLbl"></span></div>
      <div class="bar"><span id="bar"></span></div>
    </div>
  </header>

  <div class="toolbar" role="group" aria-label="Filtrer">
    <button class="chip" data-f="all" aria-pressed="true">🎁 Tous</button>
    <button class="chip" data-f="free" aria-pressed="false">🟢 Disponibles</button>
    <button class="chip" data-f="prio" aria-pressed="false">⭐ Prioritaires</button>
    <button class="chip" data-f="taken" aria-pressed="false">🎀 Déjà réservés</button>
  </div>
  <div class="status" id="status"></div>
  <main class="grid" id="grid"></main>
  <footer>Fait avec ❤️ et beaucoup de neige · la liste se met à jour toute seule</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form class="dialog" id="form">
    <button type="button" class="x" id="close" aria-label="Fermer">×</button>
    <h2 id="mTitle">Je réserve !</h2>
    <div class="what"><img id="mImg" alt=""><span id="mName"></span></div>
    <label for="who">Ton prénom (ou « Mamie & Papy »)</label>
    <input id="who" maxlength="60" autocomplete="name" required placeholder="ex : Tata Sophie">
    <div class="hint">Les autres verront que ce cadeau est déjà pris, et par qui.</div>
    <div class="err" id="err"></div>
    <button class="btn green" id="submit">🎄 Confirmer la réservation</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
const DEMO_DATA = [{"id": 1, "nom": "Figurine pokemon", "prioritaire": true, "commentaire": "lot d'occasion", "occasion": true, "images": ["https://images.king-jouet.com/6/gu997071_6.jpg"], "liens": [], "reservePar": ""}, {"id": 2, "nom": "figurine Dragon ball", "prioritaire": true, "commentaire": "vegeta, goku et goku enfant, peut importe la taille", "occasion": true, "images": ["https://m.media-amazon.com/images/I/71Wzuu32E+L._AC_SY300_SX300_QL70_ML2_.jpg", "https://m.media-amazon.com/images/I/71y210JMlnL._AC_SY300_SX300_QL70_ML2_.jpg", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw8DptwmIJsRpa3yNGBay1QT9b_r0-H2YwZ8oQ8iRv7g&s"], "liens": [], "reservePar": ""}, {"id": 3, "nom": "Epée Minecraft", "prioritaire": false, "commentaire": "", "occasion": false, "images": [], "liens": [], "reservePar": ""}, {"id": 4, "nom": "Figurine Sonic", "prioritaire": true, "commentaire": "Shadow/sonic robot", "occasion": true, "images": ["https://cdn.idealo.com/folder/Product/205652/9/205652939/s4_produktbild_max_4/jakks-pacific-sonic-the-hedgehog-shadow-423994.jpg"], "liens": [], "reservePar": ""}, {"id": 5, "nom": "Figurine hulk", "prioritaire": true, "commentaire": "", "occasion": true, "images": ["https://m.media-amazon.com/images/I/61+O7PBNaZL._AC_SY300_SX300_QL70_ML2_.jpg"], "liens": [], "reservePar": ""}, {"id": 6, "nom": "Figurine Spiderman", "prioritaire": true, "commentaire": "", "occasion": true, "images": ["https://cdn.idealo.com/folder/Product/201510/6/201510680/s4_produktbild_gross/hasbro-marvel-spider-man-titan-hero-series-spider-man.jpg"], "liens": [], "reservePar": ""}, {"id": 7, "nom": "Peluche Woody", "prioritaire": true, "commentaire": "", "occasion": false, "images": ["https://m.media-amazon.com/images/I/71i279zxuLL._AC_UF1000,1000_QL80_.jpg"], "liens": [], "reservePar": ""}, {"id": 8, "nom": "Kapla", "prioritaire": true, "commentaire": "", "occasion": true, "images": ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmevJiSMGo6EsF2bPyHsU0OnGhQHmUez_dV9J0RXojZQ&s=10"], "liens": [], "reservePar": ""}, {"id": 9, "nom": "KIDI dj Mix pro", "prioritaire": false, "commentaire": "avec Piano", "occasion": false, "images": ["https://m.media-amazon.com/images/I/71xtYwb9FOL._AC_SX425_.jpg"], "liens": [], "reservePar": ""}, {"id": 10, "nom": "Super console turbo pilote", "prioritaire": true, "commentaire": "", "occasion": true, "images": ["https://www.king-jouet.com/fstrz/r/s/images.king-jouet.com/6/gu944262_6.jpg"], "liens": [], "reservePar": ""}, {"id": 11, "nom": "Bloc magnetique", "prioritaire": false, "commentaire": "", "occasion": false, "images": [], "liens": [], "reservePar": ""}, {"id": 12, "nom": "Camion transporteur double dragon hotwheel", "prioritaire": true, "commentaire": "40€ à carrefour et - 25% sur la carte", "occasion": true, "images": ["https://media.carrefour.fr/media/referential/media/fce0923522484a6ab3ebc404ac2bf3d3/p_540x540/0194735264179_0.jpg"], "liens": [], "reservePar": ""}, {"id": 13, "nom": "Voiture", "prioritaire": false, "commentaire": "Des voiture hotwheel peut importe / il voulait la mad maga", "occasion": true, "images": ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiA5PElGl_qd76KnSRwOUjf7JXNMaeX2P2o2V-Z78aXhmJvIiYH77g3ZRj&s=10"], "liens": [], "reservePar": ""}, {"id": 14, "nom": "Monster truck", "prioritaire": false, "commentaire": "", "occasion": true, "images": ["https://m.media-amazon.com/images/I/91AADY4MJmL._AC_SX300_SY300_QL70_ML2_.jpg"], "liens": [], "reservePar": ""}, {"id": 15, "nom": "Croc carotte", "prioritaire": true, "commentaire": "version patpatrouille ? (voir offre jeux societe)", "occasion": false, "images": ["https://m.media-amazon.com/images/I/71Dmn+BObmL._AC_SY300_SX300_QL70_ML2_.jpg"], "liens": [], "reservePar": ""}, {"id": 16, "nom": "Elephun", "prioritaire": true, "commentaire": "", "occasion": false, "images": ["https://www.king-jouet.com/fstrz/r/s/images.king-jouet.com/6/gu1032251_6.jpg"], "liens": [], "reservePar": ""}, {"id": 17, "nom": "Papa érveil", "prioritaire": true, "commentaire": "", "occasion": false, "images": ["https://images.king-jouet.com/6/gu180238_6.jpg"], "liens": [], "reservePar": ""}, {"id": 18, "nom": "Dominos", "prioritaire": false, "commentaire": "avec le train si possible", "occasion": false, "images": ["https://m.media-amazon.com/images/I/81kZ4o4QySL._AC_SX425_.jpg"], "liens": [], "reservePar": ""}, {"id": 19, "nom": "Lego", "prioritaire": false, "commentaire": "lot d'occasion", "occasion": true, "images": ["https://m.media-amazon.com/images/I/81IEO5NQZuL._AC_SX300_SY300_QL70_ML2_.jpg"], "liens": [], "reservePar": ""}, {"id": 20, "nom": "Ninja go", "prioritaire": true, "commentaire": "lot d'occasion (ou celui de l'image)(préférence ninja vert)", "occasion": true, "images": ["https://m.media-amazon.com/images/I/81GLX-UfLvL._AC_SX425_.jpg"], "liens": [], "reservePar": ""}, {"id": 21, "nom": "Peluche Pokemon", "prioritaire": true, "commentaire": "lot occasion (Preference Pikachu>salameche>bulbizarre>carapuce>mewtwo>ronflex)", "occasion": true, "images": ["https://www.cdiscount.com/pdt2/0/7/0/2/700x700/aaamg80070/rw/lot-de-3-peluches-pokmon-de.jpg"], "liens": [], "reservePar": ""}, {"id": 22, "nom": "Tape tape galaxy", "prioritaire": false, "commentaire": "Chère pour se que c'est", "occasion": true, "images": ["https://joueclub-joueclub-fr-storage.omn.proximis.com/Imagestorage/imagesSynchro/463/429/2d85751bb376754908ae2e738cffd97849057390_41339198.jpeg"], "liens": [], "reservePar": ""}, {"id": 23, "nom": "Plus plus", "prioritaire": false, "commentaire": "", "occasion": true, "images": ["https://joueclub-joueclub-fr-storage.omn.proximis.com/Imagestorage/imagesSynchro/412/440/16019429a44a08051a399ff3267ba210c19c8680_41063854.jpeg"], "liens": [], "reservePar": ""}, {"id": 24, "nom": "Peluche kpop", "prioritaire": false, "commentaire": "Toute (preference romy) + chat", "occasion": false, "images": ["https://joueclub-joueclub-fr-storage.omn.proximis.com/Imagestorage/imagesSynchro/463/429/368ce87ec258db2e681908e45eb3ce80f448a56b_41340187.jpeg", "https://joueclub-joueclub-fr-storage.omn.proximis.com/Imagestorage/imagesSynchro/463/429/1252681d592d195194aa5dcb00b74be69bf7c953_41340197.jpeg"], "liens": [], "reservePar": ""}, {"id": 25, "nom": "Tonie Box", "prioritaire": true, "commentaire": "Edition Pokemon avec les 3 autre pokemon", "occasion": false, "images": ["https://joueclub-joueclub-fr-storage.omn.proximis.com/Imagestorage/imagesSynchro/463/429/2861038eaba51a6398a0ca21d5814aaa436adf9e_41346055.jpeg"], "liens": [], "reservePar": ""}];
const API = window.API_URL;
const DEMO = !API;
const $ = s => document.querySelector(s);
let items = [], filter = 'all', current = null, slide = {};

/* ---------- données ---------- */
let demoRes = {};
try { demoRes = JSON.parse(localStorage.getItem('noel-demo-res') || '{}'); } catch(e){}
function demoLoad(){
  return DEMO_DATA.map(it => ({...it, reservePar: demoRes[it.id] || ''}));
}
async function fetchItems(){
  let list;
  if (DEMO) list = demoLoad();
  else {
    const r = await fetch(API + (API.includes('?') ? '&' : '?') + 't=' + Date.now());
    list = (await r.json()).items;
  }
  const key = it => Number.isFinite(+it.id) ? +it.id : Infinity;
  return list.sort((a, b) => key(a) - key(b));
}
async function reserve(id, nom){
  if (DEMO){
    const cur = demoLoad().find(i => i.id === id);
    if (cur.reservePar) return {ok:false, error:'Déjà réservé par ' + cur.reservePar};
    demoRes[id] = nom; try { localStorage.setItem('noel-demo-res', JSON.stringify(demoRes)); } catch(e){}
    await new Promise(r => setTimeout(r, 500));
    return {ok:true, item:{...cur, reservePar:nom}};
  }
  // text/plain => pas de pré-requête CORS avec Apps Script
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'reserve', id, nom})});
  return r.json();
}

/* ---------- rendu ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';
const emojiFor = n => {
  n = n.toLowerCase();
  return /peluche/.test(n)?'🧸':/voiture|camion|truck|turbo/.test(n)?'🚗':/lego|kapla|bloc|plus|domino|ninja/.test(n)?'🧱':
         /[ée]p[ée]e/.test(n)?'⚔️':/dj|tonie|music/.test(n)?'🎵':'🎁';
};

function cardHTML(it, idx){
  const imgs = it.images || [], i = (slide[it.id] || 0) % Math.max(imgs.length,1);
  const media = imgs.length
    ? `<img src="${esc(safeUrl(imgs[i]))}" alt="${esc(it.nom)}" loading="lazy" referrerpolicy="no-referrer"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'${emojiFor(it.nom)}'}))">`
    : `<div class="placeholder">${emojiFor(it.nom)}</div>`;
  const dots = imgs.length > 1 ? `<div class="dots">${imgs.map((_,k)=>`<b class="${k===i?'on':''}"></b>`).join('')}</div>
    <button type="button" class="nav prev" data-dir="-1" aria-label="Image précédente">‹</button>
    <button type="button" class="nav next" data-dir="1" aria-label="Image suivante">›</button>` : '';
  const tags = [
    it.occasion ? '<span class="tag">♻️ Occasion recommandée</span>' : '',
    imgs.length > 1 ? `<span class="tag" style="background:#fdf0d5;color:#8a5a00">🖼️ ${imgs.length} idées</span>` : ''
  ].join('');
  const shop = u => { try { return new URL(u).hostname.replace(/^www\./,'').split('.').slice(-2,-1)[0]; } catch(e){ return ''; } };
  const links = (it.liens||[]).map(l => `<a class="shop" href="${esc(safeUrl(l))}" target="_blank" rel="noopener noreferrer">🛒 Voir la boutique${
      it.liens.length > 1 && shop(l) ? ` <small>(${esc(shop(l))})</small>` : ''}</a>`).join('');
  const taken = !!it.reservePar;
  return `<article class="slot" style="animation-delay:${Math.min(idx*40,600)}ms"><div class="card ${taken?'reserved':''}">
    ${it.prioritaire ? '<div class="ribbon-tag">⭐ PRIORITAIRE</div>' : ''}
    <div class="media" data-slide="${it.id}" title="${imgs.length>1?'Clique pour voir les autres images':''}">${media}${dots}
      ${taken ? `<div class="stamp"><small>Réservé par</small><strong>${esc(it.reservePar)}</strong></div>` : ''}
    </div>
    <div class="body">
      <h3 class="name">${esc(it.nom)}</h3>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${it.commentaire ? `<p class="comment">${esc(it.commentaire)}</p>` : ''}
      <div class="spacer"></div>
      ${links ? `<div class="links">${links}</div>` : ''}
      ${taken ? `<div class="reserved-note">🎀 Déjà réservé</div>`
              : `<button class="btn" data-reserve="${it.id}">🎁 Je réserve ce cadeau</button>`}
    </div>
  </div></article>`;
}

function render(){
  const list = items.filter(it =>
    filter==='free' ? !it.reservePar : filter==='taken' ? !!it.reservePar : filter==='prio' ? it.prioritaire : true);
  $('#grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty">${filter==='taken' ? 'Aucun cadeau réservé pour l’instant… à toi de jouer ! 🎅' : 'Rien ici 🎄'}</div>`;
  const n = items.filter(i => i.reservePar).length, t = items.length;
  $('#countLbl').textContent = `🎁 ${n} / ${t} cadeaux réservés`;
  $('#pctLbl').textContent = t ? Math.round(n/t*100) + ' %' : '';
  $('#bar').style.width = t ? (n/t*100) + '%' : '0';
}

/* ---------- rafraîchissement auto ---------- */
let lastSig = '';
async function refresh(first){
  try {
    const data = await fetchItems();
    const sig = JSON.stringify(data.map(i => [i.id, i.reservePar, i.nom]));
    if (first) { items = data; render(); }
    else if (sig !== lastSig) {
      const before = new Map(items.map(i => [i.id, i.reservePar]));
      items = data; render();
      const fresh = data.filter(i => i.reservePar && !before.get(i.id));
      if (fresh.length === 1) toast(`🎀 « ${fresh[0].nom} » vient d’être réservé par ${fresh[0].reservePar}`);
      else if (fresh.length > 1) toast(`🎀 ${fresh.length} cadeaux viennent d’être réservés`);
    }
    lastSig = sig;
    $('#status').innerHTML = (DEMO ? '<span class="demo">MODE DÉMO</span>' : '') +
      'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  } catch(e){
    $('#status').textContent = '⚠️ Impossible de charger la liste, nouvel essai dans quelques secondes…';
    if (first) $('#grid').innerHTML = '<div class="empty">Chargement impossible 😢</div>';
  }
}

/* ---------- interactions ---------- */
document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c===b));
  render();
});
$('#grid').addEventListener('click', e => {
  const r = e.target.closest('[data-reserve]');
  if (r) return openModal(+r.dataset.reserve);
  const m = e.target.closest('[data-slide]');
  if (m){
    const id = +m.dataset.slide, imgs = items.find(i => i.id === id)?.images || [];
    if (imgs.length < 2) return;
    const dir = +(e.target.closest('[data-dir]')?.dataset.dir || 1);
    slide[id] = ((slide[id]||0) + dir + imgs.length) % imgs.length;
    const img = m.querySelector('img');
    if (img) img.src = safeUrl(imgs[slide[id]]);
    m.querySelectorAll('.dots b').forEach((b,k) => b.classList.toggle('on', k === slide[id]));
  }
});

function openModal(id){
  current = items.find(i => i.id === id);
  $('#mName').textContent = current.nom;
  $('#mImg').src = current.images?.[0] || '';
  $('#mImg').style.display = current.images?.length ? '' : 'none';
  $('#err').textContent = '';
  try { $('#who').value = localStorage.getItem('noel-name') || ''; } catch(e){}
  $('#modal').classList.add('open');
  setTimeout(() => $('#who').focus(), 50);
}
const closeModal = () => $('#modal').classList.remove('open');
$('#close').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#form').onsubmit = async e => {
  e.preventDefault();
  const nom = $('#who').value.trim();
  if (!nom) return $('#err').textContent = 'Il faut un prénom 🙂';
  const btn = $('#submit'); btn.disabled = true; btn.textContent = '⏳ Emballage en cours…';
  try {
    const res = await reserve(current.id, nom);
    if (res.ok){
      try { localStorage.setItem('noel-name', nom); } catch(e){}
      closeModal(); await refresh(true); celebrate();
      toast(`🎉 Merci ${nom} ! « ${current.nom} » est réservé.`);
    } else {
      $('#err').textContent = res.error || 'Oups, ça n’a pas marché';
      refresh(true);
    }
  } catch(err){ $('#err').textContent = 'Erreur réseau, réessaie 🙏'; }
  btn.disabled = false; btn.textContent = '🎄 Confirmer la réservation';
};

let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 4500); }
function celebrate(){
  const em = ['🎁','⭐','❄️','🎄','🎀','✨'];
  for (let i=0;i<40;i++){
    const s = document.createElement('div'); s.className='confetti';
    s.textContent = em[i%em.length]; s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = 2+Math.random()*2+'s'; s.style.animationDelay = Math.random()*.5+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(), 5000);
  }
}

/* ---------- déco : guirlande + neige ---------- */
$('#lights').innerHTML = '<i></i>'.repeat(Math.max(8, Math.floor(innerWidth/48)));
(() => {
  const c = $('#snow'), x = c.getContext('2d'); let W, H, flakes;
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight;
    flakes = Array.from({length: Math.min(160, W/8)}, () => ({x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*3, s:.3+Math.random()*1, d:Math.random()*6})); };
  size(); addEventListener('resize', size);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function loop(t){
    x.clearRect(0,0,W,H); x.fillStyle='rgba(255,255,255,.85)'; x.beginPath();
    for (const f of flakes){ f.y += f.s; f.x += Math.sin(t/1500 + f.d)*.4;
      if (f.y > H){ f.y = -5; f.x = Math.random()*W; }
      x.moveTo(f.x, f.y); x.arc(f.x, f.y, f.r, 0, 7); }
    x.fill(); requestAnimationFrame(loop);
  })(0);
})();

refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, window.REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
